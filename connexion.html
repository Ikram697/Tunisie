<!DOCTYPE HTML>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion</title>
    <link rel="stylesheet" href="Style.css">
</head>

<body>
    <p id="TitreFormulairedeconnexion">Formulaire de connexion</p>

<form action="#" method="POST">
    <div>
        <label for="nom">Nom :</label> 
        <input type="text" id="nom" name="nom" required placeholder="Doe">
    </div>

    <br><div>
        <label for="prenom">Prénom :</label>
        <input type="text" id="prenom" name="prenom" required placeholder="John">
    </div>

    <br><div>
        <label for="mail">Mail :</label>
        <input type="email" id="mail" name="mail" required placeholder="jdoe@gmail.com">
    </div>

    <br><div>
        <label for="motdepasse">Mot de passe :</label>
        <input type="password" id="motdepasse" name="motdepasse">
    </div>

    <br><div>
        <label for="telephone"> Téléphone :</label>
        <input type="tel" id="telephone" name="telephone" required placeholder="+00 0 00 00 00 00">
    </div>

    <br><div class="CouleurBouttonSeConnecterEtCliquerIci">
        <button type="submit">Se connecter </button> 
    </div>

    <br><div>
        <a href="message_connexion.html" target="_blank" class="CouleurLienPageFormulaireDeConnexion">Se connecter</a>
    </div>

<br><div>
    <p>Mot de passe oublié ? <button type="submit">Cliquer ici</button></p>
    <p>Mot de passe oublié ? <a href="mot_de_passe_oubie.html" target="_blank" class="CouleurLienPageFormulaireDeConnexion"> Cliquer ici</a></p>
</div>




</form>
</body>
