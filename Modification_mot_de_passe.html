<!DOCTYPE HTML>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modification mot de passe</title>
    <link rel="stylesheet" href="Style.css">
</head>

<body>
    <h3 class="CouleurEntête-Connexion-Mdp"> Veuillez remplir les champs ci-dessous afin de modifier votre mot de passe</h3>
 
    <form action="#" method="POST">
<div>
    <label for="nom">Nom:</label>
    <input type="text" id="nom" name="nom" required placeholder="Doe">
</div>

<br><div>
    <label for="prenom">Prénom:</label>
    <input type="text" id="prenom" name="prenom" required placeholder="John">
</div>

<br><div>
    <label for="mail">Mail:</label>
    <input type="email" id="mail" name="mail" required placeholder="jdoe@gmail.com">
</div>

<br><div>
    <label for="ancienmotdepasse" class="CouleurModificationMotdePasse">Ancien mot de passe:</label>
    <input type="password" id="ancienmotdepasse" name="ancienmotdepasse">
</div>

<br><div>
    <label for="nouveaumotdepasse" class="CouleurModificationMotdePasse">Nouveau mot de passe:</label>
    <input type="password" id="nouveaumotdepasse" name="nouveaumotdepasse">
</div>

<br><div>
    <label for="confirmationnouveaumotdepasse" class="CouleurModificationMotdePasse">Confirmation nouveau mot de passe:</label>
    <input type="password" id="confirmationnouveaumotdepasse" name="confirmationnouveaumotdepasse">
</div>

<br><div id="ModificationBoutonModif-Mdp">
    <button type="submit">Modifier mon mot de passe</button>

</div>







</body>

</form>
