<!DOCTYPE HTML>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Réinitialisation mot de passe</title>
    <link rel="stylesheet" href="Style.css">
</head>

<body>
    <h3> Veuillez remplir les champs ci-dessous afin de réinitialiser votre mot de passe</h3>
 
    <form action="#" method="POST">
    <div>
        <label for="motdepasse">Nouveau mot de passe:</label>
        <input type="password" id="motdepasse" name="motdepasse">
     </div>

     <div>
        <br><label for="verificationmotdepasse">Vérification mot de passe:</label>
        <input type="password" id="verificationmotdepasse" name="verificationmotdepasse">
     </div>

     <div>
        <br><button type="submit">Réinitialiser mot de passe</button>
        <a href="message_réinitialisation_mot_de_passe.html" target="_blank" id="LienReinitialise">Réinitialiser </a>
    </div>


    </form>

    </body>
